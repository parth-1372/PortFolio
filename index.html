<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title (MOST IMPORTANT FOR SEO) -->
  <title>Parth Mungra | Software Engineer & Full Stack Developer </title>

  <!-- Primary SEO Description -->
  <meta
    name="description"
    content="Parth Mungra is a Full Stack Developer and Software Engineer specializing in React, Node.js, MongoDB, and modern web technologies. Passionate about building scalable, high-performance web applications and solving real-world problems."
  />

  <!-- SEO Keywords (still useful for context) -->
  <meta
    name="keywords"
    content="Parth Mungra, Full Stack Developer, Software Developer, Web Developer, React Developer, Node.js Developer, JavaScript Engineer, MERN Stack Developer, Portfolio"
  />

  <!-- Author -->
  <meta name="author" content="Parth Mungra" />

  <!-- Canonical URL (VERY IMPORTANT) -->
  <link rel="canonical" href="https://portfolio-iota-red-85.vercel.app/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Parth Mungra | Full Stack Developer & Software Engineer" />
  <meta
    property="og:description"
    content="Explore the portfolio of Parth Mungra, a Full Stack Developer building modern, scalable, and efficient web applications using React, Node.js, and the MERN stack."
  />
  <meta property="og:url" content="https://portfolio-iota-red-85.vercel.app/" />
  <meta property="og:image" content="https://portfolio-iota-red-85.vercel.app/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Parth Mungra | Full Stack Developer" />
  <meta
    name="twitter:description"
    content="Full Stack Developer specializing in modern web technologies. View projects, skills, and experience."
  />
  <meta name="twitter:image" content="https://portfolio-iota-red-85.vercel.app/og-image.png" />

  <!-- Google Fonts (Performance optimized) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  
  <!-- Structured Data (JSON-LD for Google) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Parth Mungra",
      "url": "https://portfolio-iota-red-85.vercel.app/",
      "jobTitle": "Full Stack Developer",
      "description": "Full Stack Developer and Software Engineer specializing in React, Node.js, and modern web technologies.",
      "sameAs": [
        "https://github.com/your-github",
        "https://www.linkedin.com/in/your-linkedin"
      ]
    }
  </script>
</head>

<body>
  <!-- React root -->
  <div id="root"></div>

  <!-- Main Script -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
